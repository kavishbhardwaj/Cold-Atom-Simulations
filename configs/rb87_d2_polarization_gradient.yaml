model: polarization_gradient
atom:
  isotope: 87Rb
  line: D2
  manifold: F2_to_Fprime3_closed
laser:
  detuning_gamma: -3.0
  saturation_per_beam: 0.08
  phases_rad: [0.0, 0.0, 0.0, 1.5707963267948966, 0.0, 0.7853981633974483]
  coherence_groups: [all, all, all, all, all, all]
magnetic_field:
  uniform_t: [0.0, 0.0, 0.0]
simulation:
  periods: 24
  discard_periods: 12
  steps_per_period: 80
  velocity_m_per_s: 0.02
output:
  directory: results/polarization_gradient
