model: multilevel_rate_equation
atom:
  isotope: 87Rb
  line: D2
laser:
  role: cooling
  configuration: six_independent_beams
  target_transition: f2_to_fprime3
  power_per_beam_w: 0.010
  waist_m: 0.008
  detuning_gamma: -2.0
repump:
  role: repump
  configuration: six_independent_beams
  target_transition: f1_to_fprime2
  power_per_beam_w: 0.0005
  waist_m: 0.008
  detuning_gamma: 0.0
magnetic_field:
  model: ideal_quadrupole_plus_uniform_stray
  radial_gradient_t_per_m: 0.10
  uniform_stray_t: [0.0, 0.0, 0.0]
  stray_gradient_t_per_m: [[0, 0, 0], [0, 0, 0], [0, 0, 0]]
gravity:
  vector_m_per_s2: [0.0, 0.0, -9.80665]
simulation:
  mode: quick
  duration_s: 0.0001
  max_step_s: 0.00001
  initial_position_m: [0.0, 0.0, 0.0]
  initial_velocity_m_per_s: [0.0, 0.0, 0.0]
monte_carlo:
  atoms: 64
  time_step_s: 0.000000005
  store_every: 200
  seed: 20260811
rate_equation:
  position_extent_m: 0.003
  points: 81
output:
  directory: results/multilevel
