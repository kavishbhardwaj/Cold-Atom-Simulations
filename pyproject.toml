[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cold-atom-mot"
version = "0.1.0"
description = "Documented 3D semiclassical and stochastic 87Rb MOT simulation"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.9", "PyYAML>=6.0"]

[project.scripts]
cold-atom-mot = "cold_atom_mot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
